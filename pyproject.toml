[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-agent"
version = "0.1.0"
description = "Windows desktop market-analysis assistant using local screen capture and OCR."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Trade Agent contributors" }]
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "Pillow>=10.4",
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.11"]

[project.scripts]
trade-agent = "trade_agent.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an explicitly selected real Windows window"]
